# 把读者带离底部，并**赖在那里**——这是场景①最该被量的那一半。
#
# ## 为什么是"反复划"而不是"划三下"
#
# Maestro 起自己的 XCTest runner，冷启动在满载机器上要 20–30 秒，而流式回放到底跑多久
# 取决于**当时的负载**（同一份代码：装机时 10 秒、load 500 时 100 秒）。写死"划三下"
# 会让这一轮落在流式的什么位置完全看运气——运气不好就在流式结束之后，于是"没测到"
# 被伪装成"通过"。反复划把这件事变成幂等的：只要它开始跑，列表就一定在底部之外。
#
# ## 判据
#
# 这一段划完之后的**安静帧**就是 `tools/frame-probe/measure.py` 里的阅读模式：
# 距底 > 40pt、没有手指/惯性、之后每一次追加都不许把距底距离缩小（判据 C），
# 首条可见行的屏幕位置不许动（判据 A）。
appId: ai.memoh.ios
---
- extendedWaitUntil:
    # 场景台头部：流式时是 "frame 12/257"，放完是 "replayed 257/257"。
    # 门开得宽一点（两种都算"到了"）：等不到就等于白跑 300 秒。**手势到底落在流式的
    # 什么位置，不在 flow 里假装知道**——宿主侧按"阅读模式里有多少个带追加的帧对"
    # 判这一轮作不作数（measure.py 的 invalid 分支）。
    visible: '(?s).*(frame|replayed) .*'
    timeout: 300000

- repeat:
    times: 12
    commands:
      # ⚠️ 方向不能写反：手指往上划（80%→20%）是**往列表末尾**滚，而列表本来就贴在末尾，
      # 于是 36 次滑动"全部 COMPLETED"却一步没动（本轮真实踩到，探针的阅读帧数=0 才暴露）。
      # 要离开底部，手指得**往下拖**。
      - swipe:
          # 场景页头部约占上方 1/3；从 20% 起手会拖到 header，Maestro 虽报
          # COMPLETED，原生列表却收不到手势。起点必须落在消息列表里面。
          start: 50%, 45%
          end: 50%, 80%
      - swipe:
          start: 50%, 45%
          end: 50%, 80%
      - swipe:
          start: 50%, 45%
          end: 50%, 80%
      - waitForAnimationToEnd:
          timeout: 4000
