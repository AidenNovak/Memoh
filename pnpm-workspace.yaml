packages:
  - 'packages/*'
  - 'apps/*'
  # `@memoh-ios/kit` 既是 Expo 本地原生模块（`ios/` + expo-module.config.json），
  # 也是 JS 侧 import 的包。列进来才是一个真 workspace 包：pnpm 会把它链接进
  # node_modules，任何只认 node_modules 的工具（eslint / 脚本 / 代码生成器）都能解析到它。
  # 详见 memoh-ios-dev.md「为什么 kit 是 workspace 包」。
  - 'apps/mobile/modules/*'

allowBuilds:
  electron-winstaller: true
  esbuild: true
  protobufjs: false
  sharp: true
  vue-demi: true

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - sharp

patchedDependencies:
  dockview-core@7.0.2: patches/dockview-core@7.0.2.patch
  dockview-vue@7.0.2: patches/dockview-vue@7.0.2.patch
  reka-ui@2.10.1: patches/reka-ui@2.10.1.patch
