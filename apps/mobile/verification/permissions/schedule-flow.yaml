# chat-only 直接深链编辑页：页面自己挡住，不请求定时任务端点。
appId: ai.memoh.ios
---
- extendedWaitUntil:
    visible:
      id: 'schedule-permission'
    timeout: 120000
- assertVisible: 'No schedule management access'
- assertVisible: 'This account can view the agent, but it can.t create or edit scheduled tasks.*'
- assertNotVisible:
    id: 'schedule-save'
- assertNotVisible:
    id: 'schedule-delete'
- takeScreenshot: permissions-03-schedule-deep-link
