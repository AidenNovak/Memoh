# 会话行真实动作：长按 → 重命名 → 列表刷新 → 再长按 → 从助手轮次分叉 → 打开新会话。
#
# 不用坐标，也不启用 retryTapIfNoChange：每个入口都必须由自己的 testID/文案首击命中。
appId: ai.memoh.ios
---
- extendedWaitUntil:
    visible:
      id: 'session-row-fixture-session-long-title'
    timeout: 120000
- longPressOn:
    id: 'session-row-fixture-session-long-title'
- extendedWaitUntil:
    visible: '^Rename$'
    timeout: 10000
- assertVisible: 'Fork from last reply'
- tapOn: '^Rename$'
- extendedWaitUntil:
    visible:
      id: 'session-rename-input'
    timeout: 10000
- eraseText: 500
- inputText: 'Renamed session'
- tapOn:
    id: 'session-rename-save'
- extendedWaitUntil:
    visible: 'Renamed session.*'
    timeout: 30000
- takeScreenshot: session-actions-01-renamed

- longPressOn:
    id: 'session-row-fixture-session-long-title'
- extendedWaitUntil:
    visible: 'Fork from last reply'
    timeout: 10000
- tapOn: 'Fork from last reply'
- extendedWaitUntil:
    visible:
      id: 'chat-back'
    timeout: 30000
- assertVisible: 'Renamed session \(fork\).*'
- takeScreenshot: session-actions-02-forked-chat
- tapOn:
    id: 'chat-back'
- extendedWaitUntil:
    visible:
      id: 'session-row-fixture-session-created-1'
    timeout: 30000
- assertVisible: 'Renamed session \(fork\).*'
- takeScreenshot: session-actions-03-forked-list
