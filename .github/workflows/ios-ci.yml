name: iOS CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - "tools/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - "tools/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript contracts and bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mobile JavaScript and TypeScript
        working-directory: apps/mobile
        run: pnpm typecheck && pnpm i18n:check && pnpm ternary:check && pnpm press:check && pnpm lint && pnpm format:check

      - name: Test mobile logic and verification helpers
        run: pnpm --filter @memoh-ios/mobile test

      - name: Export the iOS JavaScript bundle
        run: pnpm ios:bundle

  swift-logic:
    name: Swift logic contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile and run Foundation-only tests
        working-directory: apps/mobile/modules/memoh-kit
        run: |
          swiftc -O \
            ios/Chat/Transcript.swift \
            ios/Chat/Markdown.swift \
            ios/Support/MemohStrings.swift \
            ios/Notifications/NotificationContract.swift \
            verification/MessageListTests.swift \
            verification/NotificationContractTests.swift \
            -o /tmp/memoh-logic-tests
          /tmp/memoh-logic-tests

  native:
    name: Native build and hosted tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native project
        run: pnpm ios:prebuild

      - name: Install CocoaPods dependencies
        run: pnpm ios:pods

      - name: Typecheck Swift sources
        run: pnpm ios:typecheck:foundation && pnpm ios:typecheck:kit

      - name: Build for the iOS Simulator
        run: pnpm --dir apps/mobile exec python3 verification/build.py --destination "generic/platform=iOS Simulator"

      - name: Run hosted MemohKit tests
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes --json | jq -r '.runtimes | map(select(.isAvailable and (.identifier | contains("iOS")))) | last | .identifier')
          device_type=$(xcrun simctl list devicetypes --json | jq -r '.devicetypes | map(select(.identifier | contains("iPhone"))) | first | .identifier')
          if [[ -z "$runtime" || "$runtime" == "null" || -z "$device_type" || "$device_type" == "null" ]]; then
            echo "No available iOS Simulator runtime or iPhone device type" >&2
            exit 1
          fi
          udid=$(xcrun simctl create "Memoh CI" "$device_type" "$runtime")
          trap 'xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true; xcrun simctl delete "$udid" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          MEMOH_VERIFY_UDID="$udid" pnpm ios:test:hosted
