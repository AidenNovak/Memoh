# 文件视图的交互：预览三态 + 长按动作 + 下载的诚实说明。
#
# 这一屏的静态观感由 `pnpm verify:ui --case pages --page files*` 出图；这里验的是
# **点下去会怎样**——预览走哪一支（文本 / 二进制 / 超大）、长按出不出动作清单、
# 没有落盘能力时"下载"是不是明说而不是装死。
#
# ⚠️ 不自己 launchApp（Expo 开发菜单的悬浮按钮会压住右上角吃点击，见
# verification/presentation/README.md 第 5 条）；起始 URL 由 run.sh 给。
#
# 依赖固定服务端的 fs 数据：`data/notes.txt`（文本）、`data/bundle.tar.gz`（二进制）、
# `data/huge.log`（超大）。
appId: ai.memoh.ios
---
- tapOn:
    text: '^Skip$'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'hub-view-files'
    timeout: 90000
- tapOn:
    id: 'hub-view-files'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: files-01-root

# ④ 长按 = 动作清单（打开 / 复制路径 / 下载 / 看改动）。
# **放在最前面做**：长按必须发生在列表**静止**时——刚滑完还在减速时的按压会被当成
# 滚动手势取消（实测那次既没开预览也没出清单，看起来像"长按没实现"）。
# 清单本身是原生 ActionSheetIOS：一项灰掉时原因写在 message 里，不是只说"不可用"。
# 按**坐标**长按，不按 testID：实测 `longPressOn: id:` 在这台设备上不触发 RN 的
# `onLongPress`（探针证明回调没进），而同样的手势按坐标立刻就弹出清单。
- longPressOn:
    point: '50%,60%'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Copy path'
- takeScreenshot: files-05-long-press-actions
- tapOn: 'Cancel'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: files-06-actions-dismissed

# ① 文本预览：点 notes.txt
- tapOn:
    id: 'file-row-notes.txt'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: files-02-preview-text
# 返回用**系统边缘侧滑**：预览页的返回按钮位置随标题长度变，猜坐标会打偏
# （实测有一次没回去，于是后面那条找不到行——看起来像"行点不到"，其实是没退出来）。
- swipe:
    start: '2%,50%'
    end: '75%,50%'
- waitForAnimationToEnd:
    timeout: 4000

# ② 二进制：点 bundle.tar.gz —— 不该尝试读内容，只给原因 + 下载入口
- tapOn:
    id: 'file-row-bundle.tar.gz'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: files-03-preview-binary
- swipe:
    start: '2%,50%'
    end: '75%,50%'
- waitForAnimationToEnd:
    timeout: 4000

# ③ 超大文件：点 huge.log —— 只给下载。（它在列表靠下）
# `scrollUntilVisible` 在这个 FlatList 上不认（找不到滚动容器），所以用固定滑动：
# 这一屏的 fixture 数据是写死的，滑几下到哪一项是确定的。
- swipe:
    direction: UP
- swipe:
    direction: UP
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'file-row-huge.log'
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: files-04-preview-too-large
- swipe:
    start: '2%,50%'
    end: '75%,50%'
- waitForAnimationToEnd:
    timeout: 4000
